name: Validate Wildmon 3D (no APK export)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    name: Validate Godot project without exporting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          test -x "$GODOT" || chmod +x "$GODOT"
          "$GODOT" --version

      - name: Check GDScript syntax
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --check-only --script res://scripts/game.gd

      - name: Import project and validate resources
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          LOG="$RUNNER_TEMP/godot-import.log"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --editor --quit --verbose 2>&1 | tee "$LOG"
          if grep -E "(^|[[:space:]])(ERROR|SCRIPT ERROR):" "$LOG"; then
            echo "Godot reported errors while importing the project."
            exit 1
          fi

      - name: Run main scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          LOG="$RUNNER_TEMP/godot-runtime.log"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --quit-after 120 2>&1 | tee "$LOG"
          if grep -E "(^|[[:space:]])(ERROR|SCRIPT ERROR):" "$LOG"; then
            echo "Godot reported runtime errors while starting the main scene."
            exit 1
          fi
