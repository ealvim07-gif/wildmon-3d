name: Build Wildmon 3D Android Beta APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export and verify Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          TOOLS_ZIP="$RUNNER_TEMP/android-command-line-tools.zip"
          TOOLS_TMP="$RUNNER_TEMP/android-command-line-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools" "$TOOLS_TMP"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            --output "$TOOLS_ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TOOLS_ZIP" | sha256sum --check
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_TMP"
          mv "$TOOLS_TMP/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x "$SDK_ROOT/build-tools/34.0.0/aapt"
          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/ndk/23.2.8568313"
          test -d "$SDK_ROOT/cmake/3.10.2.4988404"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DEST"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DEST/"
          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"

      - name: Download optimized CC0 nature models
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_world_assets.sh
          scripts/fetch_world_assets.sh
          du -sh assets/nature
          find assets/nature -maxdepth 1 -type f | sort

      - name: Install pinned Terrain3D 1.0.2 addon
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_terrain3d.sh
          scripts/fetch_terrain3d.sh

      - name: Import project and register Terrain3D classes
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E "SCRIPT ERROR|Parse Error|GDExtension.*(failed|error)|Failed to load" "$RUNNER_TEMP/import.log"; then
            echo "Godot import reported a project or extension error."
            exit 1
          fi

      - name: Assert protagonist files exist before export
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/characters/Superhero_Male_FullBody.gltf
          test -s assets/characters/Superhero_Male_FullBody.bin
          test -s assets/characters/UAL1_Standard.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          gltf = json.loads(Path("assets/characters/Superhero_Male_FullBody.gltf").read_text(encoding="utf-8"))
          for image in gltf.get("images", []):
              uri = image.get("uri", "")
              if uri and not Path("assets/characters", uri).is_file():
                  raise SystemExit(f"GLTF texture missing: {uri}")
          print("GLTF, BIN, animation GLB and referenced textures present.")
          PY

      - name: Validate project scripts and resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --check-only --script res://scripts/game.gd

      - name: Run headless gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --quit-after 5 2>&1 | tee "$RUNNER_TEMP/game-smoke.log"
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid set index|Node not found" "$RUNNER_TEMP/game-smoke.log"; then
            echo "Runtime smoke test reported a gameplay error."
            exit 1
          fi

      - name: Create temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "ANDROID_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path("export_presets.cfg")
          data = path.read_text(encoding="utf-8")
          marker = "[preset.0.options]\n"
          settings = (
              'keystore/debug="' + str(Path.home() / ".android/debug.keystore") + '"\n'
              'keystore/debug_user="androiddebugkey"\n'
              'keystore/debug_password="android"\n'
          )
          if marker not in data:
              raise SystemExit("Android preset options section not found")
          if "keystore/debug=" not in data:
              data = data.replace(marker, marker + settings, 1)
          path.write_text(data, encoding="utf-8")
          print("Configured temporary Android debug signing key in the CI workspace.")
          PY

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --verbose --export-debug "Android" "build/Wildmon3D-Beta20.apk"

      - name: Verify APK package and archive
        shell: bash
        run: |
          set -euo pipefail
          APK="build/Wildmon3D-Beta20.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.wildmon.game'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'Wildmon 3D'" "$RUNNER_TEMP/apk-badging.txt"
          # Godot's Android export embeds imported resources under assets/; no standalone PCK is required.
          unzip -l "$APK" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -F "assets/.godot/imported/Superhero_Male_FullBody.gltf-" "$RUNNER_TEMP/apk-contents.txt"
          grep -F "assets/.godot/imported/T_Superhero_Male_Dark.png-" "$RUNNER_TEMP/apk-contents.txt"
          grep -F "assets/.godot/imported/UAL1_Standard.glb-" "$RUNNER_TEMP/apk-contents.txt"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildmon3D-Beta20-Android-APK
          path: build/Wildmon3D-Beta20.apk
          if-no-files-found: error
          retention-days: 14
