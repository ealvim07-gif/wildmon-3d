name: Validate Wildmon 3D world

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/import.log"; then
            echo "Godot reported a script or parse error during import."
            exit 1
          fi

      - name: Inspect character assets and write animation list
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script scripts/character_asset_check.gd 2>&1 | tee "$RUNNER_TEMP/character-check.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|Failed to load" "$RUNNER_TEMP/character-check.log"; then
            echo "Character asset validation reported an error."
            exit 1
          fi

      - name: Commit animation list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/animations_list.txt
          if git diff --cached --quiet; then
            echo "Animation list unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Record imported UAL1 animation names"
          git push

      - name: Assert protagonist GLTF loads
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script scripts/protagonist_model_check.gd 2>&1 | tee "$RUNNER_TEMP/protagonist-check.log"
          if grep -F "FALLBACK ANTIGO" "$RUNNER_TEMP/protagonist-check.log"; then
            echo "Legacy fallback diagnostic detected."
            exit 1
          fi
          grep -F "MODELO NOVO CARREGADO" "$RUNNER_TEMP/protagonist-check.log"

      - name: Launch world and assert protagonist model
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --quit-after 12 2>&1 | tee "$RUNNER_TEMP/runtime.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/runtime.log"; then
            echo "Runtime validation reported a script or parse error."
            exit 1
          fi
          if grep -F "FALLBACK ANTIGO" "$RUNNER_TEMP/runtime.log"; then
            echo "Legacy protagonist fallback was used."
            exit 1
          fi
          if ! grep -F "MODELO NOVO CARREGADO" "$RUNNER_TEMP/runtime.log"; then
            echo "New GLTF protagonist was not confirmed by runtime."
            exit 1
          fi
